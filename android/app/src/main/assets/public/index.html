<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://fonts.googleapis.com https://fonts.gstatic.com;" />
  <title>MyCall</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --green: #25D366;
      --green-dark: #128C7E;
      --green-panel: #075E54;
      --bg: #F0F2F5;
      --surface: #FFFFFF;
      --text: #111B21;
      --text-secondary: #667781;
      --border: rgba(0,0,0,0.08);
      --bubble-out: #D9FDD3;
      --bubble-in: #FFFFFF;
      --icon: #54656F;
      --hover: #F5F6F6;
      --selected: #EEFBF4;
      --unread: #25D366;
      --radius: 10px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111B21;
        --surface: #1F2C34;
        --text: #E9EBF0;
        --text-secondary: #8696A0;
        --border: rgba(255,255,255,0.06);
        --bubble-out: #005C4B;
        --bubble-in: #1F2C34;
        --icon: #8696A0;
        --hover: #2A3942;
        --selected: #2A3942;
      }
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
    }

    /* ── APP SHELL ── */
    #app {
      display: flex;
      height: 100dvh;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    #sidebar {
      width: 360px;
      min-width: 360px;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-right: 0.5px solid var(--border);
      transition: transform 0.25s ease;
    }

    .sidebar-header {
      background: var(--green-panel);
      padding: calc(var(--safe-top) + 14px) 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sidebar-header h1 { color: white; font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
    .header-icons { display: flex; gap: 4px; }
    .icon-btn {
      width: 36px; height: 36px;
      border-radius: 50%; background: none; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.12); }
    .icon-btn svg { fill: rgba(255,255,255,0.85); }

    /* SEARCH */
    .search-bar { padding: 8px 12px; background: var(--surface); }
    .search-wrap { position: relative; display: flex; align-items: center; }
    .search-wrap svg { position: absolute; left: 10px; fill: var(--text-secondary); pointer-events: none; }
    .search-input {
      width: 100%; background: var(--bg); border: none; border-radius: 8px;
      padding: 9px 12px 9px 36px; font-size: 14px; color: var(--text);
      outline: none; font-family: inherit;
    }
    .search-input::placeholder { color: var(--text-secondary); }

    /* TABS */
    .tabs {
      display: flex; border-bottom: 0.5px solid var(--border);
      padding: 0 16px; gap: 0;
    }
    .tab {
      flex: 1; padding: 11px 4px; font-size: 13px; font-weight: 500;
      text-align: center; color: var(--text-secondary); cursor: pointer;
      border-bottom: 2px solid transparent; transition: all 0.18s;
      user-select: none;
    }
    .tab.active { color: var(--green-dark); border-bottom-color: var(--green-dark); }

    /* LIST */
    .list { overflow-y: auto; flex: 1; }
    .list::-webkit-scrollbar { width: 3px; }
    .list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .list-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; cursor: pointer;
      border-bottom: 0.5px solid var(--border);
      transition: background 0.1s; user-select: none;
    }
    .list-item:hover { background: var(--hover); }
    .list-item.active { background: var(--selected); }

    .avatar {
      width: 48px; height: 48px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 600; flex-shrink: 0; color: white;
    }
    .avatar.group { border-radius: 12px; }
    .av-g { background: #25D366; }
    .av-b { background: #34B7F1; }
    .av-o { background: #FFA040; }
    .av-p { background: #A55EEA; }
    .av-r { background: #E05050; }
    .av-t { background: #10a87e; }
    .av-i { background: #F97316; }

    .item-body { flex: 1; min-width: 0; }
    .item-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
    .item-name { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
    .item-time { font-size: 11.5px; color: var(--text-secondary); white-space: nowrap; margin-left: 8px; flex-shrink: 0; }
    .item-time.unread { color: var(--unread); }
    .item-bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .item-preview { font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge {
      background: var(--unread); color: white; border-radius: 50%;
      min-width: 18px; height: 18px; font-size: 11px; font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      padding: 0 5px; flex-shrink: 0;
    }

    /* QUICK ACTIONS */
    .quick-actions {
      display: flex; gap: 8px; padding: 10px 12px;
      border-top: 0.5px solid var(--border); background: var(--surface);
    }
    .qa-btn {
      flex: 1; padding: 9px 8px; border-radius: 22px; border: none;
      font-size: 13px; font-weight: 500; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: opacity 0.15s;
    }
    .qa-btn:active { opacity: 0.8; }
    .qa-contact { background: var(--green); color: white; }
    .qa-group { background: var(--green-dark); color: white; }
    .qa-btn svg { fill: white; }

    /* ── CHAT PANEL ── */
    #chatPanel {
      flex: 1; display: flex; flex-direction: column;
      background: var(--bg); min-width: 0; position: relative;
    }

    #emptyState {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; padding: 40px;
    }
    .empty-icon {
      width: 80px; height: 80px; border-radius: 50%;
      background: rgba(37,211,102,0.1);
      display: flex; align-items: center; justify-content: center;
    }
    .empty-icon svg { fill: var(--green); }
    #emptyState h2 { font-size: 18px; font-weight: 500; color: var(--text); }
    #emptyState p { font-size: 14px; color: var(--text-secondary); text-align: center; max-width: 260px; line-height: 1.5; }

    #chatView { display: none; flex: 1; flex-direction: column; height: 100%; }
    #chatView.open { display: flex; }

    /* CHAT HEADER */
    .chat-header {
      background: var(--surface); padding: 8px 12px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 0.5px solid var(--border); min-height: 58px;
    }
    .chat-avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; cursor: pointer; }
    .chat-avatar.group { border-radius: 10px; }
    .chat-info { flex: 1; cursor: pointer; min-width: 0; }
    .chat-name { font-size: 15px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-status { font-size: 12px; color: var(--text-secondary); margin-top: 1px; }
    .chat-status.online { color: var(--green-dark); }
    .chat-actions { display: flex; gap: 2px; }
    .act-btn {
      width: 38px; height: 38px; border-radius: 50%; background: none; border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .act-btn:hover { background: var(--hover); }
    .act-btn svg { fill: var(--icon); }
    .back-btn { display: none; }

    /* MESSAGES */
    .messages {
      flex: 1; overflow-y: auto; padding: 12px 16px;
      display: flex; flex-direction: column; gap: 2px;
    }
    .messages::-webkit-scrollbar { width: 3px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .date-sep { text-align: center; margin: 10px 0; }
    .date-sep span {
      background: var(--surface); color: var(--text-secondary);
      font-size: 11.5px; padding: 4px 12px; border-radius: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    .msg {
      max-width: 65%; padding: 7px 10px 4px; border-radius: 8px;
      font-size: 14px; line-height: 1.45; word-break: break-word; position: relative;
    }
    .msg.in { background: var(--bubble-in); border-top-left-radius: 2px; align-self: flex-start; box-shadow: 0 1px 2px rgba(0,0,0,0.07); }
    .msg.out { background: var(--bubble-out); border-top-right-radius: 2px; align-self: flex-end; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .msg-meta { display: flex; align-items: center; justify-content: flex-end; gap: 3px; margin-top: 3px; }
    .msg-time { font-size: 10.5px; color: var(--text-secondary); }
    .msg-check { font-size: 12px; color: #53BDEB; }

    /* INPUT */
    .input-area {
      background: var(--surface); padding: 8px 10px calc(var(--safe-bottom) + 8px);
      display: flex; align-items: center; gap: 8px;
      border-top: 0.5px solid var(--border);
    }
    .input-wrap {
      flex: 1; background: var(--bg); border-radius: 22px;
      display: flex; align-items: center; padding: 0 14px; gap: 8px;
      min-height: 44px;
    }
    .input-wrap svg { fill: var(--icon); flex-shrink: 0; }
    .msg-input {
      flex: 1; background: none; border: none; outline: none;
      font-size: 15px; color: var(--text); padding: 10px 0;
      font-family: inherit; resize: none; max-height: 120px;
    }
    .msg-input::placeholder { color: var(--text-secondary); }
    .send-btn {
      width: 44px; height: 44px; border-radius: 50%; background: var(--green);
      border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: transform 0.12s;
    }
    .send-btn:active { transform: scale(0.92); }
    .send-btn svg { fill: white; }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; padding: 20px;
      animation: fadeIn 0.15s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      background: var(--surface); border-radius: 14px; width: 100%; max-width: 320px;
      overflow: hidden; animation: slideUp 0.2s ease;
    }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .modal-header { background: var(--green-panel); padding: 16px 18px; color: white; font-size: 16px; font-weight: 600; }
    .modal-body { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .modal-input {
      background: var(--bg); border: 0.5px solid var(--border); border-radius: 10px;
      padding: 11px 13px; font-size: 14px; color: var(--text); outline: none;
      width: 100%; font-family: inherit;
    }
    .modal-input:focus { border-color: var(--green); }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 0 16px 16px; }
    .btn { padding: 9px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; font-family: inherit; }
    .btn-cancel { background: var(--bg); color: var(--text-secondary); }
    .btn-ok { background: var(--green); color: white; }
    .btn-ok:active { opacity: 0.85; }

    /* ── CALL OVERLAY ── */
    .calling-overlay {
      position: fixed; inset: 0;
      background: linear-gradient(165deg, #075E54 0%, #0a8068 50%, #128C7E 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      z-index: 300; padding: 40px 20px;
      animation: fadeIn 0.2s ease;
    }
    .calling-avatar {
      width: 96px; height: 96px; border-radius: 50%;
      background: rgba(255,255,255,0.18);
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; font-weight: 700; color: white;
      margin-bottom: 8px;
    }
    .calling-name { font-size: 24px; font-weight: 600; color: white; }
    .calling-status { font-size: 14px; color: rgba(255,255,255,0.72); margin-top: -4px; }
    .call-actions { display: flex; gap: 28px; margin-top: 40px; }
    .call-btn {
      width: 62px; height: 62px; border-radius: 50%; border: none;
      cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 5px;
      transition: transform 0.12s;
    }
    .call-btn:active { transform: scale(0.9); }
    .call-btn svg { fill: white; }
    .call-btn span { font-size: 10px; color: rgba(255,255,255,0.8); }
    .btn-end { background: #E05050; }
    .btn-mute { background: rgba(255,255,255,0.18); }
    .btn-speaker { background: rgba(255,255,255,0.18); }
    .call-video-hint { color: rgba(255,255,255,0.5); font-size: 12px; margin-top: 8px; }

    /* ── RESPONSIVE MOBILE ── */
    @media (max-width: 680px) {
      #sidebar {
        position: fixed; inset: 0; width: 100%; min-width: 100%;
        z-index: 10; transform: translateX(0);
      }
      #sidebar.hidden { transform: translateX(-100%); }
      #chatPanel { position: fixed; inset: 0; z-index: 20; }
      #chatPanel.hidden { display: none; }
      .back-btn { display: flex !important; }
    }

    /* ONLINE DOT */
    .online-dot {
      width: 10px; height: 10px; background: var(--green);
      border-radius: 50%; border: 2px solid var(--surface);
      position: absolute; bottom: 1px; right: 1px;
    }
    .avatar-wrap { position: relative; flex-shrink: 0; }
  </style>
</head>
<body>

<div id="app">

  <!-- ═══════════ SIDEBAR ═══════════ -->
  <div id="sidebar">

    <div class="sidebar-header">
      <h1>MyCall</h1>
      <div class="header-icons">
        <button class="icon-btn" title="Nouveau contact" onclick="openModal('contact')">
          <svg width="20" height="20" viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </button>
        <button class="icon-btn" title="Créer un salon" onclick="openModal('group')">
          <svg width="20" height="20" viewBox="0 0 24 24"><path d="M16.5 13c-1.2 0-3.07.34-4.5 1-1.43-.67-3.3-1-4.5-1C5.33 13 1 14.08 1 16.25V18h22v-1.75c0-2.17-4.33-3.25-6.5-3.25zm-4 3.25H3v-.92C3.6 14.83 5.2 14.5 7.5 14.5c1.3 0 2.73.27 3.87.8L11 17.25zm10 0h-8.5v-.92c1.14-.53 2.57-.8 3.87-.8 2.3 0 3.9.33 4.63.83v.89zM7.5 12c1.93 0 3.5-1.57 3.5-3.5S9.43 5 7.5 5 4 6.57 4 8.5 5.57 12 7.5 12zm0-5.5c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm9 5.5c1.93 0 3.5-1.57 3.5-3.5S18.43 5 16.5 5 13 6.57 13 8.5s1.57 3.5 3.5 3.5zm0-5.5c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2z"/></svg>
        </button>
        <button class="icon-btn" title="Plus">
          <svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </button>
      </div>
    </div>

    <div class="search-bar">
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input class="search-input" id="searchInput" placeholder="Rechercher ou démarrer une discussion" oninput="filterList(this.value)" />
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('all',this)">Tous</div>
      <div class="tab" onclick="switchTab('contacts',this)">Contacts</div>
      <div class="tab" onclick="switchTab('groups',this)">Salons</div>
    </div>

    <div class="list" id="mainList"></div>

    <div class="quick-actions">
      <button class="qa-btn qa-contact" onclick="openModal('contact')">
        <svg width="16" height="16" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        Nouveau contact
      </button>
      <button class="qa-btn qa-group" onclick="openModal('group')">
        <svg width="16" height="16" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        Créer un salon
      </button>
    </div>

  </div><!-- /sidebar -->

  <!-- ═══════════ CHAT PANEL ═══════════ -->
  <div id="chatPanel" class="hidden">

    <div id="emptyState">
      <div class="empty-icon">
        <svg width="42" height="42" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
      </div>
      <h2>MyCall Messenger</h2>
      <p>Sélectionnez un contact ou un salon pour commencer à discuter</p>
    </div>

    <div id="chatView">

      <div class="chat-header">
        <button class="act-btn back-btn" onclick="goBack()" title="Retour">
          <svg width="22" height="22" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <div class="avatar-wrap" onclick="showProfile()">
          <div class="avatar" id="hdrAvatar" style="width:40px;height:40px;font-size:14px"></div>
          <div class="online-dot" id="onlineDot" style="display:none"></div>
        </div>
        <div class="chat-info" onclick="showProfile()">
          <div class="chat-name" id="chatName">—</div>
          <div class="chat-status" id="chatStatus">—</div>
        </div>
        <div class="chat-actions">
          <button class="act-btn" title="Appel audio" onclick="startCall('audio')">
            <svg width="21" height="21" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
          </button>
          <button class="act-btn" title="Appel vidéo" onclick="startCall('video')">
            <svg width="21" height="21" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
          </button>
          <button class="act-btn" title="Informations">
            <svg width="21" height="21" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
          </button>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="input-area">
        <div class="input-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
          <input class="msg-input" id="msgInput" placeholder="Écrivez un message..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}" />
          <svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9v7c0 1.1.9 2 2 2h4v-8H5v-1c0-3.87 3.13-7 7-7s7 3.13 7 7v1h-4v8h4c1.1 0 2-.9 2-2v-7c0-4.97-4.03-9-9-9z"/></svg>
        </div>
        <button class="send-btn" onclick="sendMsg()" title="Envoyer">
          <svg width="20" height="20" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>

    </div><!-- /chatView -->

  </div><!-- /chatPanel -->

</div><!-- /app -->

<!-- ═══════════ MODAL ═══════════ -->
<div id="modalOverlay" style="display:none" class="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header" id="modalTitle">Nouveau contact</div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn btn-ok" onclick="confirmModal()">Créer</button>
    </div>
  </div>
</div>

<!-- ═══════════ CALL OVERLAY ═══════════ -->
<div id="callingOverlay" style="display:none" class="calling-overlay">
  <div class="calling-avatar" id="callingInitials">A</div>
  <div class="calling-name" id="callingName">—</div>
  <div class="calling-status" id="callingStatus">Appel en cours...</div>
  <div id="callVideoHint" class="call-video-hint" style="display:none">Appel vidéo — caméra désactivée en démo</div>
  <div class="call-actions">
    <button class="call-btn btn-mute" id="muteBtn" onclick="toggleMute()">
      <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      <span id="muteLabel">Muet</span>
    </button>
    <button class="call-btn btn-end" onclick="endCall()">
      <svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08A1.003 1.003 0 010 12.37c0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.66c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.1-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.51-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
      <span>Raccrocher</span>
    </button>
    <button class="call-btn btn-speaker" id="speakerBtn" onclick="toggleSpeaker()">
      <svg width="24" height="24" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      <span id="speakerLabel">HP</span>
    </button>
  </div>
  <div style="color:rgba(255,255,255,0.45);font-size:12px;margin-top:16px;" id="callTimer">00:00</div>
</div>

<script>
/* ─── DATA ─── */
const COLORS = ['av-g','av-b','av-o','av-p','av-r','av-t','av-i'];

let contacts = [
  { id:1, name:'Alice Martin', initials:'AM', color:'av-g', type:'contact', lastMsg:'Ok je vois ça demain !', time:'14:32', unread:2, online:true, msgs:[
    {t:'in',txt:'Salut ! Tu es dispo ce soir ?',time:'14:20'},
    {t:'out',txt:'Oui, vers 20h ça te va ?',time:'14:22'},
    {t:'in',txt:'Parfait ! On se retrouve où ?',time:'14:28'},
    {t:'out',txt:'Place de la République, devant le café',time:'14:30'},
    {t:'in',txt:'Ok je vois ça demain !',time:'14:32'},
  ]},
  { id:2, name:'Thomas Dubois', initials:'TD', color:'av-b', type:'contact', lastMsg:'Le rapport est prêt ✓', time:'12:10', unread:0, online:false, msgs:[
    {t:'in',txt:'Bonjour, j\'ai fini le rapport',time:'12:05'},
    {t:'out',txt:'Super, tu peux me l\'envoyer ?',time:'12:07'},
    {t:'in',txt:'Le rapport est prêt ✓',time:'12:10'},
  ]},
  { id:3, name:'Projet Alpha', initials:'PA', color:'av-p', type:'group', lastMsg:'Sophie : réunion à 15h', time:'11:45', unread:5, online:false, msgs:[
    {t:'in',txt:'Sophie : La réunion est confirmée pour demain',time:'11:38'},
    {t:'in',txt:'Marc : Je serai là, pas de souci',time:'11:40'},
    {t:'out',txt:'Parfait, j\'apporte les documents de présentation',time:'11:43'},
    {t:'in',txt:'Sophie : réunion à 15h',time:'11:45'},
  ]},
  { id:4, name:'Emma Lefèvre', initials:'EL', color:'av-o', type:'contact', lastMsg:'Merci pour tout !', time:'09:20', unread:0, online:true, msgs:[
    {t:'out',txt:'N\'oublie pas le rendez-vous de vendredi',time:'09:15'},
    {t:'in',txt:'Non non je me souviens, t\'inquiète pas',time:'09:18'},
    {t:'in',txt:'Merci pour tout !',time:'09:20'},
  ]},
  { id:5, name:'Équipe Design', initials:'ED', color:'av-r', type:'group', lastMsg:'Les maquettes sont en ligne', time:'hier', unread:1, online:false, msgs:[
    {t:'in',txt:'Julie : Nouvelles maquettes disponibles sur Figma',time:'hier'},
    {t:'out',txt:'Top ! Je regarde ça dans la journée',time:'hier'},
    {t:'in',txt:'Les maquettes sont en ligne',time:'hier'},
  ]},
  { id:6, name:'Lucas Bernard', initials:'LB', color:'av-t', type:'contact', lastMsg:'À bientôt !', time:'lun.', unread:0, online:false, msgs:[
    {t:'in',txt:'On se voit la semaine prochaine ?',time:'lun.'},
    {t:'out',txt:'Oui bien sûr, mardi ou mercredi ?',time:'lun.'},
    {t:'in',txt:'Mardi c\'est parfait',time:'lun.'},
    {t:'out',txt:'Ok super, à mardi alors',time:'lun.'},
    {t:'in',txt:'À bientôt !',time:'lun.'},
  ]},
];

/* ─── STATE ─── */
let currentContact = null;
let currentTab = 'all';
let modalType = '';
let callTimer = null;
let callSeconds = 0;
let muted = false;
let speakerOn = false;
const isMobile = () => window.innerWidth <= 680;

/* ─── LIST ─── */
function getFiltered(search='') {
  return contacts.filter(c => {
    const matchTab = currentTab==='all'
      || (currentTab==='contacts' && c.type==='contact')
      || (currentTab==='groups' && c.type==='group');
    const matchSearch = !search || c.name.toLowerCase().includes(search.toLowerCase());
    return matchTab && matchSearch;
  });
}

function renderList(search='') {
  const el = document.getElementById('mainList');
  const items = getFiltered(search);
  if (!items.length) {
    el.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text-secondary);font-size:13px;">Aucun résultat</div>';
    return;
  }
  el.innerHTML = items.map(c => `
    <div class="list-item${currentContact&&currentContact.id===c.id?' active':''}" onclick="openChat(${c.id})">
      <div class="avatar-wrap">
        <div class="avatar ${c.color}${c.type==='group'?' group':''}">${c.initials}</div>
        ${c.online?'<div class="online-dot"></div>':''}
      </div>
      <div class="item-body">
        <div class="item-top">
          <span class="item-name">${escHtml(c.name)}</span>
          <span class="item-time${c.unread?' unread':''}">${c.time}</span>
        </div>
        <div class="item-bottom">
          <span class="item-preview">${escHtml(c.lastMsg)}</span>
          ${c.unread?`<span class="badge">${c.unread}</span>`:''}
        </div>
      </div>
    </div>
  `).join('');
}

function filterList(v) { renderList(v); }
function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderList(document.getElementById('searchInput').value);
}

/* ─── CHAT ─── */
function openChat(id) {
  currentContact = contacts.find(c=>c.id===id);
  currentContact.unread = 0;

  // Header
  const av = document.getElementById('hdrAvatar');
  av.className = 'avatar ' + currentContact.color + (currentContact.type==='group'?' group':'');
  av.textContent = currentContact.initials;
  document.getElementById('onlineDot').style.display = currentContact.online ? 'block' : 'none';
  document.getElementById('chatName').textContent = currentContact.name;
  const st = document.getElementById('chatStatus');
  if (currentContact.online) {
    st.textContent = 'en ligne';
    st.className = 'chat-status online';
  } else if (currentContact.type==='group') {
    st.textContent = (Math.floor(Math.random()*4)+2) + ' membres';
    st.className = 'chat-status';
  } else {
    st.textContent = 'vu récemment';
    st.className = 'chat-status';
  }

  renderMessages();
  renderList();

  if (isMobile()) {
    document.getElementById('sidebar').classList.add('hidden');
    document.getElementById('chatPanel').classList.remove('hidden');
  } else {
    document.getElementById('chatPanel').classList.remove('hidden');
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('chatView').style.display = 'flex';
  }
  document.getElementById('msgInput').focus();
}

function goBack() {
  document.getElementById('chatPanel').classList.add('hidden');
  document.getElementById('sidebar').classList.remove('hidden');
  currentContact = null;
  renderList();
}

function renderMessages() {
  const el = document.getElementById('messages');
  el.innerHTML = '<div class="date-sep"><span>Aujourd\'hui</span></div>'
    + currentContact.msgs.map(m => `
      <div class="msg ${m.t}">
        ${escHtml(m.txt)}
        <div class="msg-meta">
          <span class="msg-time">${m.time}</span>
          ${m.t==='out'?'<span class="msg-check">✓✓</span>':''}
        </div>
      </div>
    `).join('');
  el.scrollTop = el.scrollHeight;
}

function sendMsg() {
  const inp = document.getElementById('msgInput');
  const txt = inp.value.trim();
  if (!txt || !currentContact) return;
  const time = nowTime();
  currentContact.msgs.push({t:'out', txt, time});
  currentContact.lastMsg = txt;
  currentContact.time = time;
  inp.value = '';
  renderMessages();
  renderList();

  // Auto-reply
  setTimeout(() => {
    const replies = [
      'Je vois, merci !','D\'accord, c\'est noté.','On en reparle bientôt',
      '👍','Super, parfait !','Entendu !','Ok merci !','Bonne idée',
      'Je te confirme ça rapidement','Vu !',
    ];
    const r = replies[Math.floor(Math.random()*replies.length)];
    currentContact.msgs.push({t:'in', txt:r, time:nowTime()});
    currentContact.lastMsg = r;
    currentContact.time = nowTime();
    renderMessages();
    renderList();
  }, 900 + Math.random()*800);
}

function showProfile() {
  if (!currentContact) return;
  alert(`Profil : ${currentContact.name}\nType : ${currentContact.type==='group'?'Salon':'Contact'}\nStatut : ${currentContact.online?'En ligne':'Hors ligne'}`);
}

/* ─── MODAL ─── */
function openModal(type) {
  modalType = type;
  document.getElementById('modalTitle').textContent = type==='contact' ? 'Nouveau contact' : 'Créer un salon';
  document.getElementById('modalBody').innerHTML = type==='contact' ? `
    <input class="modal-input" id="mi1" placeholder="Prénom et nom" maxlength="40" />
    <input class="modal-input" id="mi2" placeholder="Numéro ou email" />
  ` : `
    <input class="modal-input" id="mi1" placeholder="Nom du salon" maxlength="40" />
    <input class="modal-input" id="mi2" placeholder="Description (optionnel)" />
  `;
  document.getElementById('modalOverlay').style.display = 'flex';
  setTimeout(() => document.getElementById('mi1').focus(), 80);
}

function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }

function confirmModal() {
  const v = document.getElementById('mi1').value.trim();
  if (!v) { document.getElementById('mi1').focus(); return; }
  const col = COLORS[contacts.length % COLORS.length];
  const initials = v.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2) || v.slice(0,2).toUpperCase();
  contacts.unshift({
    id: Date.now(), name: v, initials, color: col,
    type: modalType==='group' ? 'group' : 'contact',
    lastMsg: 'Démarrez la conversation…', time: 'maintenant',
    unread: 0, online: false, msgs: []
  });
  closeModal();
  renderList();
}

/* ─── CALL ─── */
function startCall(type) {
  if (!currentContact) return;
  document.getElementById('callingInitials').textContent = currentContact.initials;
  document.getElementById('callingName').textContent = currentContact.name;
  document.getElementById('callingStatus').textContent = type==='video' ? 'Appel vidéo…' : 'Appel audio…';
  document.getElementById('callVideoHint').style.display = type==='video' ? 'block' : 'none';
  document.getElementById('callingOverlay').style.display = 'flex';
  callSeconds = 0;
  document.getElementById('callTimer').textContent = '00:00';
  muted = false; speakerOn = false;
  document.getElementById('muteLabel').textContent = 'Muet';
  document.getElementById('speakerLabel').textContent = 'HP';

  setTimeout(() => {
    document.getElementById('callingStatus').textContent = type==='video' ? 'Appel vidéo connecté' : 'Connecté';
    callTimer = setInterval(() => {
      callSeconds++;
      const m = String(Math.floor(callSeconds/60)).padStart(2,'0');
      const s = String(callSeconds%60).padStart(2,'0');
      document.getElementById('callTimer').textContent = m+':'+s;
    }, 1000);
  }, 1600);
}

function endCall() {
  clearInterval(callTimer);
  document.getElementById('callingOverlay').style.display = 'none';
}

function toggleMute() {
  muted = !muted;
  document.getElementById('muteLabel').textContent = muted ? 'Activé' : 'Muet';
  document.getElementById('muteBtn').style.background = muted ? 'rgba(255,255,255,0.45)' : 'rgba(255,255,255,0.18)';
}
function toggleSpeaker() {
  speakerOn = !speakerOn;
  document.getElementById('speakerLabel').textContent = speakerOn ? 'HP On' : 'HP';
  document.getElementById('speakerBtn').style.background = speakerOn ? 'rgba(255,255,255,0.45)' : 'rgba(255,255,255,0.18)';
}

/* ─── UTILS ─── */
function nowTime() {
  const d = new Date();
  return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
}
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ─── RESPONSIVE ─── */
function handleResize() {
  if (!isMobile()) {
    document.getElementById('sidebar').classList.remove('hidden');
    document.getElementById('chatPanel').classList.remove('hidden');
    if (!currentContact) {
      document.getElementById('emptyState').style.display = 'flex';
      document.getElementById('chatView').style.display = 'none';
    }
  }
}
window.addEventListener('resize', handleResize);
handleResize();

/* ─── KEYBOARD ─── */
document.addEventListener('keydown', e => {
  if (e.key==='Escape') { closeModal(); endCall(); }
});

/* ─── INIT ─── */
renderList();
</script>
</body>
</html>
